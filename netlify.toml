[build]
command = "npm run build"
publish = "dist"
[build.environment]
NODE_VERSION = "24"

[[headers]]
for = "/_astro/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/models/*"
[headers.values]
Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
for = "/images/shots/tex/*"
[headers.values]
Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
